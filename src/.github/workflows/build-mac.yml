name: 🍎 Build macOS DMG Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-mac:
    name: 🔨 Build MagmaFlow for macOS
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
    
    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 📦 Download JavaFX SDK
      run: |
        echo "📦 Downloading JavaFX for macOS..."
        wget -q https://download2.gluonhq.com/openjfx/21.0.1/openjfx-21.0.1_osx-x64_bin-sdk.zip
        unzip -q openjfx-21.0.1_osx-x64_bin-sdk.zip
        mv javafx-sdk-21.0.1 javafx-sdk
        echo "JAVAFX_PATH=$(pwd)/javafx-sdk/lib" >> $GITHUB_ENV
    
    - name: 🔨 Compile JavaFX Application
      run: |
        echo "🔨 Compiling MagmaFlow application..."
        mkdir -p build/classes
        
        javac --module-path $JAVAFX_PATH \
              --add-modules javafx.controls,javafx.fxml,javafx.web \
              -d build/classes \
              src/main/java/com/carlosbuss/MagmaFlow.java
    
    - name: 📦 Create JAR File
      run: |
        echo "📦 Creating executable JAR..."
        mkdir -p dist
        
        jar --create \
            --file dist/MagmaFlow.jar \
            --main-class com.carlosbuss.MagmaFlow \
            -C build/classes .
    
    - name: 🏗️ Create macOS App Bundle
      run: |
        echo "🏗️ Creating macOS application bundle..."
        
        jpackage \
          --type app-image \
          --name "MagmaFlow" \
          --app-version "1.0.0" \
          --input dist/ \
          --main-jar MagmaFlow.jar \
          --main-class com.carlosbuss.MagmaFlow \
          --module-path $JAVAFX_PATH \
          --add-modules javafx.controls,javafx.fxml,javafx.web \
          --dest dist/ \
          --vendor "Carlos Buss" \
          --copyright "Copyright © 2024 Carlos Buss" \
          --mac-package-identifier "com.carlosbuss.magmaflow" \
          --java-options "-Xmx2048m"
    
    - name: 📀 Create Professional DMG Installer
      run: |
        echo "📀 Creating professional DMG installer..."
        
        APP_NAME="MagmaFlow"
        DMG_NAME="MagmaFlow-1.0.0-macOS"
        VOLUME_NAME="MagmaFlow Installer"
        
        # Create temporary DMG
        hdiutil create -size 300m -fs HFS+ -volname "$VOLUME_NAME" temp.dmg
        
        # Mount the DMG
        hdiutil attach temp.dmg -mountpoint "/Volumes/$VOLUME_NAME"
        
        # Copy app to DMG
        cp -R "dist/$APP_NAME.app" "/Volumes/$VOLUME_NAME/"
        
        # Create Applications symlink
        ln -s /Applications "/Volumes/$VOLUME_NAME/Applications"
        
        # Add installation instructions
        cat > "/Volumes/$VOLUME_NAME/How to Install.txt" << 'EOF'
        Welcome to MagmaFlow!
        
        To install MagmaFlow:
        1. Drag the MagmaFlow app to the Applications folder
        2. Launch MagmaFlow from your Applications folder
        3. Enjoy!
        
        If you see a security warning:
        - Right-click the app → Open → Open anyway
        - Or go to System Preferences → Security & Privacy → Allow
        
        Built with ❤️ by Carlos Buss
        EOF
        
        # Customize DMG appearance
        cat > setup_dmg.applescript << 'EOF'
        tell application "Finder"
          tell disk "MagmaFlow Installer"
            open
            set current view of container window to icon view
            set toolbar visible of container window to false
            set the bounds of container window to {100, 100, 800, 500}
            set viewOptions to the icon view options of container window
            set arrangement of viewOptions to not arranged
            set icon size of viewOptions to 128
            set position of item "MagmaFlow.app" to {200, 200}
            set position of item "Applications" to {500, 200}
            set position of item "How to Install.txt" to {350, 320}
            close
            open
            update without registering applications
            delay 3
          end tell
        end tell
        EOF
        
        osascript setup_dmg.applescript || echo "⚠️ DMG appearance setup skipped"
        
        # Finalize DMG
        hdiutil detach "/Volumes/$VOLUME_NAME"
        hdiutil convert temp.dmg -format UDZO -o "dist/$DMG_NAME.dmg"
        rm temp.dmg setup_dmg.applescript
        
        echo "✅ DMG created: $DMG_NAME.dmg"
        ls -lh dist/*.dmg
    
    - name: ⬆️ Upload DMG Installer
      uses: actions/upload-artifact@v4
      with:
        name: MagmaFlow-macOS-Installer
        path: dist/*.dmg
        retention-days: 90
    
    - name: ⬆️ Upload App Bundle  
      uses: actions/upload-artifact@v4
      with:
        name: MagmaFlow-macOS-App
        path: dist/*.app/**
        retention-days: 30
