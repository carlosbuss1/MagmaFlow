name: 🪟 Build Windows Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: 🔨 Build MagmaFlow for Windows
    runs-on: windows-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
    
    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 📦 Download JavaFX SDK
      run: |
        echo "📦 Downloading JavaFX for Windows..."
        Invoke-WebRequest -Uri "https://download2.gluonhq.com/openjfx/21.0.1/openjfx-21.0.1_windows-x64_bin-sdk.zip" -OutFile "openjfx-windows.zip"
        Expand-Archive -Path "openjfx-windows.zip" -DestinationPath "."
        Rename-Item "javafx-sdk-21.0.1" "javafx-sdk"
        echo "JAVAFX_PATH=$(Get-Location)\javafx-sdk\lib" >> $env:GITHUB_ENV
      shell: powershell
    
    - name: 🔍 Verify Source Files
      run: |
        echo "🔍 Checking source files..."
        Get-ChildItem -Recurse -Path src\ -Filter "*.java" | ForEach-Object { Write-Host $_.FullName }
        if (Test-Path "src\main\java\com\carlosbuss\") {
          Get-ChildItem "src\main\java\com\carlosbuss\"
        } else {
          Write-Host "❌ MagmaFlow.java not found at expected location"
        }
      shell: powershell
    
    - name: 🔨 Compile JavaFX Application
      run: |
        echo "🔨 Compiling MagmaFlow application..."
        New-Item -ItemType Directory -Force -Path "build\classes"
        
        # Find all Java files
        $javaFiles = Get-ChildItem -Recurse -Path "src\main\java" -Filter "*.java" | ForEach-Object { $_.FullName }
        
        if ($javaFiles.Count -gt 0) {
          # Create sources file for javac
          $javaFiles | Out-File -FilePath "sources.txt" -Encoding utf8
          
          javac --module-path "$env:JAVAFX_PATH" --add-modules javafx.controls,javafx.fxml,javafx.web,javafx.swing -d build\classes "@sources.txt"
          
          if ($LASTEXITCODE -eq 0) {
            echo "✅ Compilation successful"
          } else {
            echo "❌ Compilation failed"
            exit 1
          }
        } else {
          echo "❌ No Java source files found!"
          exit 1
        }
      shell: powershell
    
    - name: 📦 Create JAR File
      run: |
        echo "📦 Creating executable JAR..."
        New-Item -ItemType Directory -Force -Path "dist"
        
        if (-Not (Test-Path "build\classes") -or (Get-ChildItem "build\classes").Count -eq 0) {
          echo "❌ No compiled classes found!"
          exit 1
        }
        
        jar --create --file dist\MagmaFlow.jar --main-class com.carlosbuss.MagmaFlow -C build\classes .
        echo "✅ JAR created successfully"
        Get-ChildItem dist\MagmaFlow.jar
      shell: powershell
    
    - name: 🏗️ Create Windows App
      run: |
        echo "🏗️ Creating Windows application..."
        
        if (-Not (Test-Path "dist\MagmaFlow.jar") -or (Get-Item "dist\MagmaFlow.jar").Length -eq 0) {
          echo "❌ JAR file missing or empty!"
          exit 1
        }
        
        # Clean any existing app output
        if (Test-Path "app_output") { Remove-Item -Recurse -Force "app_output" }
        New-Item -ItemType Directory -Force -Path "app_output"
        
        jpackage `
          --type app-image `
          --name "MagmaFlow" `
          --app-version "1.0.0" `
          --input dist\ `
          --main-jar MagmaFlow.jar `
          --main-class com.carlosbuss.MagmaFlow `
          --module-path "$env:JAVAFX_PATH" `
          --add-modules javafx.controls,javafx.fxml,javafx.web,javafx.swing `
          --dest app_output\ `
          --vendor "Carlos Buss" `
          --copyright "Copyright 2024 Carlos Buss" `
          --java-options "-Xmx2048m"
        
        # Move app to dist directory
        if (Test-Path "app_output\MagmaFlow") {
          Move-Item "app_output\MagmaFlow" "dist\"
          Remove-Item -Recurse -Force "app_output"
          echo "✅ Windows app created successfully"
          Get-ChildItem "dist\MagmaFlow"
        } else {
          echo "❌ Windows app creation failed!"
          if (Test-Path "app_output") { Get-ChildItem "app_output" }
          exit 1
        }
      shell: powershell
    
    - name: 📦 Create Windows Installer (MSI)
      run: |
        echo "📦 Creating Windows MSI installer..."
        
        if (-Not (Test-Path "dist\MagmaFlow")) {
          echo "❌ Windows app not found!"
          exit 1
        }
        
        # Create MSI installer
        jpackage `
          --type msi `
          --name "MagmaFlow" `
          --app-version "1.0.0" `
          --input dist\ `
          --main-jar MagmaFlow.jar `
          --main-class com.carlosbuss.MagmaFlow `
          --module-path "$env:JAVAFX_PATH" `
          --add-modules javafx.controls,javafx.fxml,javafx.web,javafx.swing `
          --dest dist\ `
          --vendor "Carlos Buss" `
          --copyright "Copyright 2024 Carlos Buss" `
          --java-options "-Xmx2048m" `
          --win-dir-chooser `
          --win-menu `
          --win-shortcut
        
        echo "✅ MSI installer created"
        Get-ChildItem dist\*.msi
      shell: powershell
    
    - name: ⬆️ Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: MagmaFlow-Windows-Installer
        path: dist/*.msi
        retention-days: 90
      if: success()
    
    - name: ⬆️ Upload Windows App
      uses: actions/upload-artifact@v4
      with:
        name: MagmaFlow-Windows-App
        path: dist/MagmaFlow/
        retention-days: 30
      if: success()
    
    - name: 📋 Debug Information
      if: failure()
      run: |
        echo "🔍 Debug information:"
        echo "Current directory contents:"
        Get-ChildItem
        echo "Build directory contents:"
        if (Test-Path "build") { Get-ChildItem "build" } else { echo "No build directory" }
        echo "Dist directory contents:"
        if (Test-Path "dist") { Get-ChildItem "dist" } else { echo "No dist directory" }
        echo "Java version:"
        java --version
        echo "JavaFX path:"
        echo $env:JAVAFX_PATH
      shell: powershell
