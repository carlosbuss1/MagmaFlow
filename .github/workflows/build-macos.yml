name: 🍎 Build macOS DMG Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:  # Allows manual trigger

jobs:
  build-mac:
    name: 🔨 Build MagmaFlow for macOS
    runs-on: macos-latest
    
    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4
    
    - name: ☕ Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: 📦 Download JavaFX SDK
      run: |
        echo "📦 Downloading JavaFX for macOS..."
        curl -L -o openjfx-21.0.1_osx-x64_bin-sdk.zip https://download2.gluonhq.com/openjfx/21.0.1/openjfx-21.0.1_osx-x64_bin-sdk.zip
        unzip -q openjfx-21.0.1_osx-x64_bin-sdk.zip
        mv javafx-sdk-21.0.1 javafx-sdk
        echo "JAVAFX_PATH=$(pwd)/javafx-sdk/lib" >> $GITHUB_ENV
        ls -la javafx-sdk/lib/  # Debug: show what's downloaded
    
    - name: 🔍 Verify Source Files
      run: |
        echo "🔍 Checking source files..."
        find src/ -name "*.java" -type f || echo "❌ No Java files found in src/"
        ls -la src/main/java/com/carlosbuss/ || echo "❌ MagmaFlow.java not found at expected location"
    
    - name: 🔨 Compile JavaFX Application
      run: |
        echo "🔨 Compiling MagmaFlow application..."
        mkdir -p build/classes
        
        # Find all Java files recursively
        find src/main/java -name "*.java" > sources.txt
        
        if [ -s sources.txt ]; then
          javac --module-path $JAVAFX_PATH \
                --add-modules javafx.controls,javafx.fxml,javafx.web \
                -d build/classes \
                @sources.txt
          echo "✅ Compilation successful"
        else
          echo "❌ No Java source files found!"
          exit 1
        fi
    
    - name: 📦 Create JAR File
      run: |
        echo "📦 Creating executable JAR..."
        mkdir -p dist
        
        # Verify compiled classes exist
        if [ ! -d "build/classes" ] || [ -z "$(ls -A build/classes)" ]; then
          echo "❌ No compiled classes found!"
          exit 1
        fi
        
        # Create JAR with proper manifest
        cat > build/MANIFEST.MF << EOF
        Manifest-Version: 1.0
        Main-Class: com.carlosbuss.MagmaFlow
        Class-Path: .
        EOF
        
        jar --create \
            --file dist/MagmaFlow.jar \
            --manifest build/MANIFEST.MF \
            -C build/classes .
        
        echo "✅ JAR created: $(ls -lh dist/MagmaFlow.jar)"
    
    - name: 🏗️ Create macOS App Bundle
      run: |
        echo "🏗️ Creating macOS application bundle..."
        
        # Verify JAR exists and is not empty
        if [ ! -f "dist/MagmaFlow.jar" ] || [ ! -s "dist/MagmaFlow.jar" ]; then
          echo "❌ JAR file missing or empty!"
          exit 1
        fi
        
        jpackage \
          --type app-image \
          --name "MagmaFlow" \
          --app-version "1.0.0" \
          --input dist/ \
          --main-jar MagmaFlow.jar \
          --main-class com.carlosbuss.MagmaFlow \
          --module-path $JAVAFX_PATH \
          --add-modules javafx.controls,javafx.fxml,javafx.web \
          --dest dist/ \
          --vendor "Carlos Buss" \
          --copyright "Copyright © 2024 Carlos Buss" \
          --mac-package-identifier "com.carlosbuss.magmaflow" \
          --java-options "-Xmx2048m" \
          --verbose
        
        # Verify app bundle was created
        if [ -d "dist/MagmaFlow.app" ]; then
          echo "✅ App bundle created successfully"
          ls -la dist/MagmaFlow.app/
        else
          echo "❌ App bundle creation failed!"
          exit 1
        fi
    
    - name: 📀 Create Professional DMG Installer
      run: |
        echo "📀 Creating professional DMG installer..."
        
        APP_NAME="MagmaFlow"
        DMG_NAME="MagmaFlow-1.0.0-macOS"
        VOLUME_NAME="MagmaFlow Installer"
        
        # Verify app bundle exists
        if [ ! -d "dist/$APP_NAME.app" ]; then
          echo "❌ App bundle not found!"
          exit 1
        fi
        
        # Create temporary directory for DMG contents
        mkdir -p dmg_contents
        cp -R "dist/$APP_NAME.app" dmg_contents/
        
        # Create Applications symlink
        ln -s /Applications dmg_contents/Applications
        
        # Add installation instructions
        cat > dmg_contents/README.txt << 'EOF'
Welcome to MagmaFlow!

To install MagmaFlow:
1. Drag the MagmaFlow app to the Applications folder
2. Launch MagmaFlow from your Applications folder
3. Enjoy!

If you see a security warning:
- Right-click the app → Open → Open anyway
- Or go to System Preferences → Security & Privacy → Allow

Built with ❤️ by Carlos Buss
EOF
        
        # Create DMG using a simpler approach
        hdiutil create -volname "$VOLUME_NAME" \
                      -srcfolder dmg_contents \
                      -ov \
                      -format UDZO \
                      -fs HFS+ \
                      "dist/$DMG_NAME.dmg"
        
        # Clean up
        rm -rf dmg_contents
        
        echo "✅ DMG created: $DMG_NAME.dmg"
        ls -lh dist/*.dmg
    
    - name: 🧪 Test DMG Integrity
      run: |
        echo "🧪 Testing DMG integrity..."
        if [ -f "dist/MagmaFlow-1.0.0-macOS.dmg" ]; then
          hdiutil verify "dist/MagmaFlow-1.0.0-macOS.dmg"
          echo "✅ DMG integrity check passed"
        else
          echo "❌ DMG file not found!"
          exit 1
        fi
    
    - name: ⬆️ Upload DMG Installer
      uses: actions/upload-artifact@v4
      with:
        name: MagmaFlow-macOS-Installer
        path: dist/*.dmg
        retention-days: 90
      if: success()
    
    - name: ⬆️ Upload App Bundle  
      uses: actions/upload-artifact@v4
      with:
        name: MagmaFlow-macOS-App
        path: dist/MagmaFlow.app/
        retention-days: 30
      if: success()
    
    - name: 📋 Debug Information
      if: failure()
      run: |
        echo "🔍 Debug information:"
        echo "Current directory contents:"
        ls -la
        echo "Build directory contents:"
        ls -la build/ || echo "No build directory"
        echo "Dist directory contents:"
        ls -la dist/ || echo "No dist directory"
        echo "Java version:"
        java --version
        echo "JavaFX path:"
        echo $JAVAFX_PATH
        echo "Environment variables:"
        env | grep -E "(JAVA|PATH)" | head -10
