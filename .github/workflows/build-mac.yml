# Add this to your existing workflow after the DMG creation step

- name: Import Code Signing Certificate
  if: ${{ secrets.MACOS_CERTIFICATE != '' }}
  run: |
    # Create temporary keychain
    security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
    security default-keychain -s build.keychain
    security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
    
    # Import certificate
    echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12
    security import certificate.p12 -k build.keychain -P "${{ secrets.CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
    security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain

- name: Sign Application
  if: ${{ secrets.MACOS_CERTIFICATE != '' }}
  run: |
    # Sign the app bundle
    codesign --force --options runtime --deep --sign "${{ secrets.SIGNING_IDENTITY }}" dist/MagmaFlow.app
    
    # Verify signing
    codesign --verify --verbose dist/MagmaFlow.app

- name: Create Signed DMG
  if: ${{ secrets.MACOS_CERTIFICATE != '' }}
  run: |
    # Recreate DMG with signed app
    rm -f dist/MagmaFlow-1.0.0-macOS.dmg
    hdiutil create -volname "MagmaFlow" -srcfolder dist/MagmaFlow.app -ov -format UDZO dist/MagmaFlow-1.0.0-macOS-signed.dmg
    
    # Sign the DMG
    codesign --force --sign "${{ secrets.SIGNING_IDENTITY }}" dist/MagmaFlow-1.0.0-macOS-signed.dmg

# Alternative: Create entitlements file for hardened runtime
- name: Create Entitlements
  run: |
    cat > entitlements.plist << EOF
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>com.apple.security.cs.allow-jit</key>
        <true/>
        <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
        <true/>
        <key>com.apple.security.cs.allow-dyld-environment-variables</key>
        <true/>
    </dict>
    </plist>
    EOF
