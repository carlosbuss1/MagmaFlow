name: Build MagmaFlow for macOS

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Download JavaFX for macOS
      run: |
        echo "Downloading JavaFX for macOS..."
        curl -L -o javafx-sdk.zip "https://download2.gluonhq.com/openjfx/21.0.1/openjfx-21.0.1_osx-x64_bin-sdk.zip"
        unzip javafx-sdk.zip
        mv javafx-sdk-21.0.1 javafx-sdk
    
    - name: Check source files
      run: |
        echo "Checking source files..."
        find src -name "*.java" -type f
        ls -la src/main/java/com/carlosbuss/
    
    - name: Compile MagmaFlow application
      run: |
        echo "Compiling MagmaFlow application..."
        mkdir -p build/classes
        javac --module-path javafx-sdk/lib --add-modules javafx.controls,javafx.fxml \
              -d build/classes src/main/java/com/carlosbuss/*.java
        echo "Compilation successful"
    
    - name: Create executable JAR
      run: |
        echo "Creating executable JAR..."
        mkdir -p dist
        cd build/classes
        jar --create --file ../../dist/MagmaFlow.jar --main-class com.carlosbuss.Magmaflow .
        cd ../..
        echo "JAR created successfully"
    
    - name: Create macOS application bundle
      run: |
        echo "Creating macOS application bundle..."
        mkdir -p dist/MagmaFlow.app/Contents/{MacOS,Resources}
        
        # Create Info.plist
        cat > dist/MagmaFlow.app/Contents/Info.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>MagmaFlow</string>
            <key>CFBundleIdentifier</key>
            <string>com.carlosbuss.magmaflow</string>
            <key>CFBundleName</key>
            <string>MagmaFlow</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
        </dict>
        </plist>
        EOF
        
        # Create launcher script
        cat > dist/MagmaFlow.app/Contents/MacOS/MagmaFlow << 'EOF'
        #!/bin/bash
        DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
        java --module-path "$DIR/../Resources/javafx-sdk/lib" \
             --add-modules javafx.controls,javafx.fxml \
             -jar "$DIR/../Resources/MagmaFlow.jar"
        EOF
        
        chmod +x dist/MagmaFlow.app/Contents/MacOS/MagmaFlow
        
        # Copy JAR and JavaFX to Resources
        cp dist/MagmaFlow.jar dist/MagmaFlow.app/Contents/Resources/
        cp -r javafx-sdk dist/MagmaFlow.app/Contents/Resources/
        
        echo "App bundle created successfully"
        ls -la dist/MagmaFlow.app/Contents/
    
    - name: Import Code Signing Certificate
  if: ${{ secrets.MACOS_CERTIFICATE != '' }}
  run: |
    # Create temporary keychain
    security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
    security default-keychain -s build.keychain
    security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
    
    # Import certificate
    echo "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode > certificate.p12
    security import certificate.p12 -k build.keychain -P "${{ secrets.CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
    security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain

- name: Sign Application
  if: ${{ secrets.MACOS_CERTIFICATE != '' }}
  run: |
    # Sign the app bundle
    codesign --force --options runtime --deep --sign "${{ secrets.SIGNING_IDENTITY }}" dist/MagmaFlow.app
    
    # Verify signing
    codesign --verify --verbose dist/MagmaFlow.app

- name: Create Signed DMG
  if: ${{ secrets.MACOS_CERTIFICATE != '' }}
  run: |
    # Recreate DMG with signed app
    rm -f dist/MagmaFlow-1.0.0-macOS.dmg
    hdiutil create -volname "MagmaFlow" -srcfolder dist/MagmaFlow.app -ov -format UDZO dist/MagmaFlow-1.0.0-macOS-signed.dmg
    
    # Sign the DMG
    codesign --force --sign "${{ secrets.SIGNING_IDENTITY }}" dist/MagmaFlow-1.0.0-macOS-signed.dmg

# Alternative: Create entitlements file for hardened runtime
- name: Create Entitlements
  run: |
    cat > entitlements.plist << EOF
    <?xml version="1.0" encoding="UTF-8"?>
    <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
    <plist version="1.0">
    <dict>
        <key>com.apple.security.cs.allow-jit</key>
        <true/>
        <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
        <true/>
        <key>com.apple.security.cs.allow-dyld-environment-variables</key>
        <true/>
    </dict>
    </plist>
    EOF
